spring:
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/forgepm}
    username: ${DATABASE_USER:forgepm}
    password: ${DATABASE_PASSWORD:forgepm}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
server:
  error:
    include-message: never
    include-stacktrace: never
forgepm:
  jwt-secret: ${JWT_SECRET}
